<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 180" width="300" height="180">
  <style>
    .climber { animation: climb 2.8s steps(8, end) .3s backwards, cheer .4s ease-in-out 3.1s 3; }
    .flag    { transform-box: fill-box; transform-origin: 0% 50%; animation: wave .7s ease-in-out 6; }
    .cloud   { animation: drift 4.2s ease-in-out backwards; }
    @keyframes climb { from { transform: translateY(116px); } to { transform: none; } }
    @keyframes cheer { 0%, 100% { transform: none; } 50% { transform: translateY(-8px); } }
    @keyframes wave  { 0%, 100% { transform: skewY(0); } 50% { transform: skewY(12deg) scaleX(.9); } }
    @keyframes drift { from { transform: translateX(-40px); } to { transform: none; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f1a2e"/><stop offset="1" stop-color="#1b1640"/>
    </linearGradient>
    <pattern id="bricks" width="20" height="12" patternUnits="userSpaceOnUse">
      <rect width="20" height="12" fill="#4a3b78"/>
      <rect x="0" y="0" width="20" height="1" fill="#2e2552"/>
      <rect x="0" y="6" width="20" height="1" fill="#2e2552"/>
      <rect x="9" y="0" width="1" height="6" fill="#2e2552"/>
      <rect x="0" y="6" width="1" height="6" fill="#2e2552"/>
    </pattern>
  </defs>
  <rect width="300" height="180" rx="14" fill="url(#bg)"/>

  <!-- moon + clouds -->
  <circle cx="246" cy="40" r="16" fill="#f2c14e" opacity=".9"/>
  <g class="cloud" fill="#2a3a5c">
    <rect x="30" y="34" width="44" height="10"/><rect x="40" y="26" width="22" height="10"/>
    <rect x="218" y="96" width="40" height="10"/><rect x="228" y="88" width="18" height="10"/>
  </g>

  <!-- tower -->
  <rect x="116" y="56" width="68" height="124" fill="url(#bricks)"/>
  <g fill="#4a3b78">
    <rect x="112" y="44" width="14" height="14"/><rect x="136" y="44" width="14" height="14"/>
    <rect x="160" y="44" width="14" height="14"/><rect x="176" y="44" width="12" height="14"/>
  </g>
  <rect x="142" y="100" width="16" height="22" rx="8" fill="#f2c14e" opacity=".85"/>

  <!-- flag -->
  <rect x="148" y="14" width="3" height="30" fill="#e6fffa"/>
  <path class="flag" d="M151 14h22l-6 7 6 7h-22z" fill="#e86f8a"/>

  <!-- climber (mini avatar), ends standing on the battlements -->
  <g class="climber" fill="#7ddbc8">
    <rect x="186" y="26" width="5" height="8"/><rect x="197" y="26" width="5" height="8"/>
    <rect x="191" y="30" width="6" height="4"/><rect x="191" y="34" width="6" height="4"/>
    <rect x="185" y="38" width="5" height="4"/><rect x="198" y="38" width="5" height="4"/>
    <rect x="191" y="40" width="6" height="4"/>
  </g>
</svg>
