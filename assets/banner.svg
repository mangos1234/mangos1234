<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" width="900" height="240" role="img" aria-labelledby="t">
  <title id="t">Hi, I'm Millie. Mobile developer building iOS and Android apps with React Native and Expo.</title>
  <style>
    /* Every element's normal style is its FINAL state, so with motion turned off
       (or once the animations finish) the banner is complete and still. */
    .title { font: 700 44px ui-monospace, "SF Mono", Menlo, Consolas, monospace; fill: #e6fffa; }
    .sub   { font: 500 20px ui-monospace, "SF Mono", Menlo, Consolas, monospace; fill: #7ddbc8; }
    .tags  { font: 400 15px ui-monospace, "SF Mono", Menlo, Consolas, monospace; fill: #8b9bb4; }

    .typer  { animation: type 1.4s steps(14, end) 0.3s backwards; }
    .cursor { opacity: 0; transform: translateX(372px); animation: cursor-move 1.4s steps(14, end) 0.3s backwards, blink 0.5s step-end 1.7s 4 backwards; }
    .fade1  { animation: rise 0.6s ease-out 1.8s backwards; }
    .fade2  { animation: rise 0.6s ease-out 2.3s backwards; }

    .star { opacity: 0.55; animation: twinkle 1.6s ease-in-out 2 backwards; }
    .s1 { animation-delay: 0.0s } .s2 { animation-delay: 0.3s } .s3 { animation-delay: 0.6s }
    .s4 { animation-delay: 0.9s } .s5 { animation-delay: 0.45s } .s6 { animation-delay: 0.75s }

    .sprite { transform-box: fill-box; transform-origin: 50% 100%;
              animation: pop 0.5s cubic-bezier(.3,1.6,.6,1) 0.6s backwards, bob 0.7s ease-in-out 1.1s 4; }
    .shadow { opacity: .35; transform-box: fill-box; transform-origin: center;
              animation: shadow 0.7s ease-in-out 1.1s 4; }

    @keyframes type        { from { transform: translateX(-372px); } to { transform: translateX(0); } }
    @keyframes cursor-move { from { transform: translateX(0); opacity: 1; } to { transform: translateX(372px); opacity: 1; } }
    @keyframes blink       { 0% { opacity: 1; } 50% { opacity: 0; } }
    @keyframes rise        { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
    @keyframes twinkle     { 0%, 100% { opacity: 0.55; } 50% { opacity: 0.1; } }
    @keyframes pop         { from { transform: scale(0); } to { transform: scale(1); } }
    @keyframes bob         { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-12px); } }
    @keyframes shadow      { 0%, 100% { transform: scaleX(1); opacity: .35; } 50% { transform: scaleX(.7); opacity: .2; } }

    /* WCAG 2.3.3: respect the viewer's "reduce motion" setting */
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
    }
  </style>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f1a2e"/>
      <stop offset="1" stop-color="#1b1640"/>
    </linearGradient>
    <clipPath id="reveal">
      <rect class="typer" x="48" y="60" width="372" height="60"/>
    </clipPath>
  </defs>

  <rect width="900" height="240" rx="16" fill="url(#bg)"/>

  <!-- pixel stars -->
  <g fill="#e6fffa">
    <rect class="star s1" x="40"  y="28"  width="4" height="4"/>
    <rect class="star s2" x="210" y="22"  width="3" height="3"/>
    <rect class="star s3" x="330" y="200" width="4" height="4"/>
    <rect class="star s4" x="470" y="34"  width="3" height="3"/>
    <rect class="star s5" x="560" y="210" width="4" height="4"/>
    <rect class="star s6" x="610" y="48"  width="3" height="3"/>
    <rect class="star s2" x="850" y="30"  width="4" height="4"/>
    <rect class="star s4" x="860" y="196" width="3" height="3"/>
    <rect class="star s1" x="660" y="190" width="3" height="3"/>
    <rect class="star s5" x="120" y="212" width="3" height="3"/>
    <rect class="star s3" x="780" y="22"  width="3" height="3"/>
    <rect class="star s6" x="420" y="214" width="3" height="3"/>
  </g>

  <!-- typed title -->
  <text class="title" x="48" y="106" clip-path="url(#reveal)">Hi, I'm Millie</text>
  <rect class="cursor" x="48" y="72" width="4" height="42" fill="#7ddbc8"/>

  <text class="sub fade1"  x="48" y="148">mobile developer · iOS &amp; Android</text>
  <text class="tags fade2" x="48" y="182">React Native · Expo · TypeScript · Reanimated</text>

  <!-- bouncing pixel sprite (your avatar) -->
  <ellipse class="shadow" cx="745" cy="186" rx="40" ry="6" fill="#000"/>
  <g class="sprite" fill="#7ddbc8">
    <rect x="701" y="66"  width="22" height="44"/>
    <rect x="767" y="66"  width="22" height="44"/>
    <rect x="723" y="88"  width="44" height="22"/>
    <rect x="734" y="110" width="22" height="22"/>
    <rect x="690" y="132" width="22" height="22"/>
    <rect x="778" y="132" width="22" height="22"/>
    <rect x="734" y="154" width="22" height="22"/>
  </g>
</svg>
