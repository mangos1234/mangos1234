<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 180" width="300" height="180">
  <style>
    /* enemies rush in toward the hero, then get knocked back by the pulse */
    .enemy { animation: swarm 1.6s ease-in-out .2s 2 backwards; }
    .pulse { opacity: 0; transform-box: fill-box; transform-origin: center;
             animation: pulse 1.6s ease-out .2s 2; }
    .hero  { transform-box: fill-box; transform-origin: 50% 100%; animation: squash 1.6s ease-in-out .2s 2; }
    .gem   { opacity: .9; animation: twinkle 1.1s ease-in-out 3 backwards; }
    @keyframes swarm {
      0%   { transform: translate(calc(var(--dx) * 1.2), calc(var(--dy) * 1.2)); opacity: 0; }
      15%  { opacity: 1; }
      58%  { transform: translate(calc(var(--dx) * -0.45), calc(var(--dy) * -0.45)); }
      100% { transform: translate(0, 0); }
    }
    @keyframes pulse {
      0%, 55% { opacity: 0; transform: scale(.4); }
      60%     { opacity: .9; transform: scale(.6); }
      100%    { opacity: 0; transform: scale(2.6); }
    }
    @keyframes squash  { 0%, 52%, 70%, 100% { transform: none; } 58% { transform: scale(1.15, .85); } }
    @keyframes twinkle { 0%, 100% { opacity: .9; } 50% { opacity: .2; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f1a2e"/><stop offset="1" stop-color="#1b1640"/>
    </linearGradient>
  </defs>
  <rect width="300" height="180" rx="14" fill="url(#bg)"/>

  <!-- ground speckles -->
  <g fill="#2a3a5c">
    <rect x="30" y="40" width="4" height="4"/><rect x="250" y="30" width="4" height="4"/>
    <rect x="60" y="150" width="4" height="4"/><rect x="230" y="150" width="4" height="4"/>
    <rect x="270" y="100" width="4" height="4"/><rect x="20" y="96" width="4" height="4"/>
  </g>

  <!-- xp gems -->
  <g fill="#7ddbc8">
    <path class="gem" style="animation-delay:.1s" d="M44 66l5 6-5 6-5-6z"/>
    <path class="gem" style="animation-delay:.5s" d="M256 128l5 6-5 6-5-6z"/>
    <path class="gem" style="animation-delay:.9s" d="M236 46l5 6-5 6-5-6z"/>
  </g>

  <!-- knockback pulse -->
  <circle class="pulse" cx="150" cy="90" r="30" fill="none" stroke="#7ddbc8" stroke-width="4"/>

  <!-- enemies: each sits about 70px from the hero; the dx/dy variables point away from the hero -->
  <g fill="#e86f8a">
    <rect class="enemy" style="--dx:70px;--dy:0px"     x="214" y="84"  width="12" height="12"/>
    <rect class="enemy" style="--dx:-70px;--dy:0px"    x="74"  y="84"  width="12" height="12"/>
    <rect class="enemy" style="--dx:0px;--dy:-62px"    x="144" y="22"  width="12" height="12"/>
    <rect class="enemy" style="--dx:0px;--dy:62px"     x="144" y="146" width="12" height="12"/>
  </g>
  <g fill="#8f7cf0">
    <rect class="enemy" style="--dx:50px;--dy:-45px"   x="194" y="39"  width="12" height="12"/>
    <rect class="enemy" style="--dx:-50px;--dy:-45px"  x="94"  y="39"  width="12" height="12"/>
    <rect class="enemy" style="--dx:50px;--dy:45px"    x="194" y="129" width="12" height="12"/>
    <rect class="enemy" style="--dx:-50px;--dy:45px"   x="94"  y="129" width="12" height="12"/>
  </g>

  <!-- hero (mini version of the avatar) -->
  <g class="hero" fill="#e6fffa">
    <rect x="138" y="76" width="6" height="12"/><rect x="156" y="76" width="6" height="12"/>
    <rect x="144" y="82" width="12" height="6"/><rect x="147" y="88" width="6" height="6"/>
    <rect x="135" y="94" width="6" height="6"/><rect x="159" y="94" width="6" height="6"/>
    <rect x="147" y="100" width="6" height="6"/>
  </g>
</svg>
