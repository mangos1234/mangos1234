<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300">
  <style>
    .phone   { animation: rise .7s cubic-bezier(.2,1.2,.4,1) backwards; }
    .phone.b { animation-delay: .15s; }
    .hero    { animation: slide-in .6s ease-out .5s backwards; }
    .row     { animation: rise .5s ease-out backwards; }
    .r1 { animation-delay: .8s } .r2 { animation-delay: .95s } .r3 { animation-delay: 1.1s }
    .heart   { transform-box: fill-box; transform-origin: center; animation: like .5s ease-out 1.9s backwards; }
    .tab-pill { animation: tabs 3s ease-in-out 1.2s; }
    .toast   { opacity: 0; animation: notify 1.8s ease-in-out 2.4s; }
    .dot     { animation: hop .6s ease-in-out 4; }
    .dot2 { animation-delay: .15s } .dot3 { animation-delay: .3s }
    .star    { opacity: .55; animation: twinkle 1.6s ease-in-out 2 backwards; }

    @keyframes rise     { from { opacity: 0; transform: translateY(24px); } to { opacity: 1; transform: none; } }
    @keyframes slide-in { from { opacity: 0; transform: translateX(40px); } to { opacity: 1; transform: none; } }
    @keyframes like     { 0% { transform: scale(1); fill: #5d6d8a; } 50% { transform: scale(1.6); } 100% { transform: scale(1); fill: #e86f8a; } }
    @keyframes tabs     { 0%, 15% { transform: none; } 30%, 50% { transform: translateX(56px); } 65%, 80% { transform: translateX(28px); } 95%, 100% { transform: none; } }
    @keyframes notify   { 0% { opacity: 0; transform: translateY(-44px); } 20%, 80% { opacity: 1; transform: none; } 100% { opacity: 0; transform: translateY(-44px); } }
    @keyframes hop      { 0%, 100% { transform: none; } 50% { transform: translateY(-8px); } }
    @keyframes twinkle  { 0%, 100% { opacity: .55; } 50% { opacity: .1; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f1a2e"/><stop offset="1" stop-color="#1b1640"/>
    </linearGradient>
    <linearGradient id="heroGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7ddbc8"/><stop offset="1" stop-color="#8f7cf0"/>
    </linearGradient>
    <clipPath id="screen"><rect width="124" height="250" rx="16"/></clipPath>
  </defs>
  <rect width="900" height="300" rx="16" fill="url(#bg)"/>

  <g fill="#e6fffa">
    <rect class="star" x="60"  y="40"  width="4" height="4"/>
    <rect class="star" style="animation-delay:.4s" x="150" y="230" width="3" height="3"/>
    <rect class="star" style="animation-delay:.8s" x="740" y="60"  width="4" height="4"/>
    <rect class="star" style="animation-delay:.2s" x="830" y="220" width="3" height="3"/>
    <rect class="star" style="animation-delay:.6s" x="110" y="130" width="3" height="3"/>
    <rect class="star" style="animation-delay:1s"  x="790" y="140" width="3" height="3"/>
  </g>

  <!-- iPhone-style -->
  <g class="phone a">
    <rect x="255" y="15" width="140" height="270" rx="24" fill="#0a0f1c" stroke="#3b4a6b" stroke-width="3"/>
    <g transform="translate(263 25)">
      <g clip-path="url(#screen)">
        <rect width="124" height="250" fill="#121a30"/>
        <!-- status bar + header -->
        <rect x="10" y="8" width="18" height="4" rx="2" fill="#8b9bb4"/>
        <rect x="96" y="8" width="18" height="4" rx="2" fill="#8b9bb4"/>
        <rect x="10" y="24" width="56" height="9" rx="4" fill="#e6fffa"/>
        <circle cx="108" cy="28" r="7" fill="#7ddbc8"/>
        <!-- hero card -->
        <rect class="hero" x="8" y="42" width="108" height="60" rx="10" fill="url(#heroGrad)"/>
        <!-- feed rows -->
        <g class="row r1"><rect x="8" y="110" width="108" height="28" rx="8" fill="#22304f"/><rect x="14" y="116" width="16" height="16" rx="4" fill="#f2c14e"/><rect x="36" y="118" width="44" height="4" rx="2" fill="#c7d2e4"/><rect x="36" y="126" width="30" height="4" rx="2" fill="#5d6d8a"/>
          <path class="heart" d="M101 120c-2-3-7-2-7 2 0 3 4 5 7 8 3-3 7-5 7-8 0-4-5-5-7-2z" fill="#e86f8a"/></g>
        <g class="row r2"><rect x="8" y="144" width="108" height="28" rx="8" fill="#22304f"/><rect x="14" y="150" width="16" height="16" rx="4" fill="#8f7cf0"/><rect x="36" y="152" width="50" height="4" rx="2" fill="#c7d2e4"/><rect x="36" y="160" width="26" height="4" rx="2" fill="#5d6d8a"/></g>
        <g class="row r3"><rect x="8" y="178" width="108" height="28" rx="8" fill="#22304f"/><rect x="14" y="184" width="16" height="16" rx="4" fill="#e86f8a"/><rect x="36" y="186" width="40" height="4" rx="2" fill="#c7d2e4"/><rect x="36" y="194" width="34" height="4" rx="2" fill="#5d6d8a"/></g>
        <!-- tab bar -->
        <rect y="216" width="124" height="34" fill="#0d1426"/>
        <rect class="tab-pill" x="9" y="222" width="26" height="18" rx="9" fill="#7ddbc8" opacity=".25"/>
        <g fill="#c7d2e4"><rect x="17" y="226" width="10" height="10" rx="2"/><rect x="45" y="226" width="10" height="10" rx="5"/><rect x="73" y="226" width="10" height="10" rx="2"/><rect x="101" y="226" width="10" height="10" rx="5"/></g>
        <!-- push notification -->
        <g class="toast"><rect x="8" y="18" width="108" height="24" rx="9" fill="#e6fffa"/><circle cx="20" cy="30" r="5" fill="#7ddbc8"/><rect x="30" y="25" width="50" height="4" rx="2" fill="#1b1640"/><rect x="30" y="32" width="34" height="3" rx="1.5" fill="#8b9bb4"/></g>
      </g>
    </g>
    <rect x="305" y="29" width="40" height="9" rx="4.5" fill="#000"/>
  </g>

  <!-- sync dots between the two platforms -->
  <g fill="#7ddbc8">
    <rect class="dot"      x="434" y="146" width="8" height="8"/>
    <rect class="dot dot2" x="446" y="146" width="8" height="8"/>
    <rect class="dot dot3" x="458" y="146" width="8" height="8"/>
  </g>

  <!-- Android-style -->
  <g class="phone b">
    <rect x="505" y="15" width="140" height="270" rx="18" fill="#0a0f1c" stroke="#3b4a6b" stroke-width="3"/>
    <g transform="translate(513 25)">
      <g clip-path="url(#screen)">
        <rect width="124" height="250" fill="#121a30"/>
        <!-- status bar + header -->
        <rect x="10" y="8" width="18" height="4" rx="2" fill="#8b9bb4"/>
        <rect x="96" y="8" width="18" height="4" rx="2" fill="#8b9bb4"/>
        <rect x="10" y="24" width="56" height="9" rx="4" fill="#e6fffa"/>
        <circle cx="108" cy="28" r="7" fill="#7ddbc8"/>
        <!-- hero card -->
        <rect class="hero" x="8" y="42" width="108" height="60" rx="10" fill="url(#heroGrad)"/>
        <!-- feed rows -->
        <g class="row r1"><rect x="8" y="110" width="108" height="28" rx="8" fill="#22304f"/><rect x="14" y="116" width="16" height="16" rx="4" fill="#f2c14e"/><rect x="36" y="118" width="44" height="4" rx="2" fill="#c7d2e4"/><rect x="36" y="126" width="30" height="4" rx="2" fill="#5d6d8a"/>
          <path class="heart" d="M101 120c-2-3-7-2-7 2 0 3 4 5 7 8 3-3 7-5 7-8 0-4-5-5-7-2z" fill="#e86f8a"/></g>
        <g class="row r2"><rect x="8" y="144" width="108" height="28" rx="8" fill="#22304f"/><rect x="14" y="150" width="16" height="16" rx="4" fill="#8f7cf0"/><rect x="36" y="152" width="50" height="4" rx="2" fill="#c7d2e4"/><rect x="36" y="160" width="26" height="4" rx="2" fill="#5d6d8a"/></g>
        <g class="row r3"><rect x="8" y="178" width="108" height="28" rx="8" fill="#22304f"/><rect x="14" y="184" width="16" height="16" rx="4" fill="#e86f8a"/><rect x="36" y="186" width="40" height="4" rx="2" fill="#c7d2e4"/><rect x="36" y="194" width="34" height="4" rx="2" fill="#5d6d8a"/></g>
        <!-- tab bar -->
        <rect y="216" width="124" height="34" fill="#0d1426"/>
        <rect class="tab-pill" x="9" y="222" width="26" height="18" rx="9" fill="#7ddbc8" opacity=".25"/>
        <g fill="#c7d2e4"><rect x="17" y="226" width="10" height="10" rx="2"/><rect x="45" y="226" width="10" height="10" rx="5"/><rect x="73" y="226" width="10" height="10" rx="2"/><rect x="101" y="226" width="10" height="10" rx="5"/></g>
        <!-- push notification -->
        <g class="toast"><rect x="8" y="18" width="108" height="24" rx="9" fill="#e6fffa"/><circle cx="20" cy="30" r="5" fill="#7ddbc8"/><rect x="30" y="25" width="50" height="4" rx="2" fill="#1b1640"/><rect x="30" y="32" width="34" height="3" rx="1.5" fill="#8b9bb4"/></g>
      </g>
    </g>
    <circle cx="575" cy="33" r="4" fill="#000"/>
  </g>
</svg>
